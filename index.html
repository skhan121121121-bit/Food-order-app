<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h3>Home</h3>
    <p class="location">Siliguri Junction Station</p>
  </div>
  <div class="profile">S</div>
</div>

<!-- SEARCH -->
<div class="search-box">
  <input type="text" placeholder="Search food or restaurant">
</div>

<!-- BANNER -->
<div class="banner">
  <div class="banner-text">
    <h2>Meals under ₹200</h2>
    <p>Best coupons + Free delivery</p>
    <button>Order now</button>
  </div>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <div class="cat">🍚<br>Fried Rice</div>
  <div class="cat">🍛<br>North Indian</div>
  <div class="cat">🌯<br>Rolls</div>
  <div class="cat">🥟<br>Momos</div>
  <div class="cat">🍰<br>Cake</div>
</div>

<!-- FILTERS -->
<div class="filters">
  <button>Filters</button>
  <button class="active">Near & Fast</button>
  <button>Under ₹200</button>
</div>

<!-- FOOD CARD -->
<div class="card">
  <img src="https://i.imgur.com/Uw6d8nD.jpg">
  <div class="card-info">
    <h4>Paneer Butter Masala</h4>
    <p>₹220 • Free Delivery</p>
    <span class="rating">4.3 ★</span>
  </div>
</div>

</body>
</html>
