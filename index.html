<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Order</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Foodie</h1>
  <p>Fast delivery at your door</p>
</header>

<div class="menu">

  <div class="card">
    <img src="https://images.pexels.com/photos/825661/pexels-photo-825661.jpeg">
    <h3>Pizza</h3>
    <p>₹199</p>
    <button onclick="addItem('Pizza',199)">Add</button>
  </div>

  <div class="card">
    <img src="https://images.pexels.com/photos/958545/pexels-photo-958545.jpeg">
    <h3>Veg Curry</h3>
    <p>₹120</p>
    <button onclick="addItem('Veg Curry',120)">Add</button>
  </div>

  <div class="card">
    <img src="https://images.pexels.com/photos/1117862/pexels-photo-1117862.jpeg">
    <h3>Chicken Curry</h3>
    <p>₹180</p>
    <button onclick="addItem('Chicken Curry',180)">Add</button>
  </div>

</div>

<!-- CART -->
<div class="cart">
  <h4>Cart (<span id="count">0</span>)</h4>
  <ul id="cartItems"></ul>
  <p>Total ₹<span id="total">0</span></p>
  <button class="checkoutBtn" onclick="openForm()">Checkout</button>
</div>

<!-- ORDER FORM -->
<div class="overlay" id="overlay">
  <div class="formBox">
    <h3>Enter Details</h3>
    <input id="name" placeholder="Name">
    <input id="phone" placeholder="Phone">
    <textarea id="address" placeholder="Address"></textarea>
    <button onclick="submitOrder()">Send Order</button>
    <button class="closeBtn" onclick="closeForm()">Cancel</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
